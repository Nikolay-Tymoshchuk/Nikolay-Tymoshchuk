name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#2f7d4f&color_dots=#ebe3d3,#b7d9c1,#7fbf95,#4a9a69,#2f7d4f
            dist/snake-dark.svg?color_snake=#6fcf97&color_dots=#2a2622,#1f4d33,#2f7d4f,#4fae75,#6fcf97

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
